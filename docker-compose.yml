version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: ../docker/web-dockerfile
    command: uwsgi --http :5000 --wsgi-file app.py --callable app --master --processes 4 --threads 2
    restart: always
    ports:
      - 5000:5000
    volumes:
      - ./data:/data/
      - ./web:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DATABASE_URL=sqlite:////data/data.db

  collector:
    build:
      context: ./collector
      dockerfile: ../docker/collector-dockerfile
    command: python main.py --url http://10.42.0.191:8000 --username <your username> --password <your password> --store-events class_data,heat_data,pilot_data,race_status,result_data,frequency_data,format_data,leaderboard,current_heat,current_laps,language,all_languages --periodic-load-types node_data,frequency_data,pilot_data,heat_data,class_data,result_data,race_status,format_data,leaderboard,current_heat,current_laps,language,all_languages --store-max-events 100
    restart: always
    volumes:
      - ./data:/data/
      - ./collector:/collector
    network_mode: host
    environment:
      - DATABASE_URL=sqlite:////data/data.db
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main.py"]
      interval: 30s
      timeout: 5s
      retries: 3

  relay:
    build:
      context: ./relay
      dockerfile: ../docker/relay-dockerfile
    command: python main.py --host 0.0.0.0 --port 5001 --poll-interval-ms 1000
    restart: always
    ports:
      - 5001:5001
    volumes:
      - ./data:/data/
      - ./relay:/relay
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DATABASE_URL=sqlite:////data/data.db

